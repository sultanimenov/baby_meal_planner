services:
  postgres:
    image: postgres:15-alpine
    container_name: meal_planner_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mealplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mealplanner}
      POSTGRES_DB: ${POSTGRES_DB:-mealplanner}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mealplanner}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

